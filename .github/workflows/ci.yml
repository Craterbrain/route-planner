name: CI

# Tests and a debug build on every push and pull request. No secrets are used here, so it is safe for forks.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - name: Accept Android SDK licenses (the runner image already has the SDK; Gradle fetches any platform it is missing)
        run: |
          sdkmanager=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$sdkmanager" --licenses >/dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Core tests and debug build
        run: ./gradlew --no-daemon :core:test :app:assembleDebug
