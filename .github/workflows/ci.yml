name: CI

# Tests and a debug build on every push and pull request. No secrets are used here, so it is safe for forks.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Core tests and debug build
        run: ./gradlew --no-daemon :core:test :app:assembleDebug
