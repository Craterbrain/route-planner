<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Label lab</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="bar">
  <button id="newAddr" title="Space">New address</button>
  <button id="reroll" class="alt" title="R">Re-roll warp &amp; dirt</button>
  <label>Warp <input id="warp" type="range" min="0" max="2" step="0.05" value="1"></label>
  <label>Dirt <input id="dirtAmt" type="range" min="0" max="2" step="0.05" value="1"></label>
  <label>Softness <input id="soft" type="range" min="0" max="2" step="0.05" value="0.6"></label>
  <label title="Thermal print head wearing out: lighter print in patches">Fade <input id="fade" type="range" min="0" max="2" step="0.05" value="0.8"></label>
  <label title="Dead print-head pixels: white vertical lines, a few skipped rows">Streaks <input id="streak" type="range" min="0" max="2" step="0.05" value="0.8"></label>
  <label title="Uneven paper feed: bands where the print bunches up or stretches">Feed <input id="feed" type="range" min="0" max="2" step="0.05" value="0.8"></label>
  <span id="meta"></span>
</div>
<div id="stage">
  <div id="scene">
    <div id="sheet">
      <div id="paper">
        <div id="label"></div>
        <div id="shade"></div>
        <canvas id="dirt" width="720" height="1080"></canvas>
        <canvas id="defects" width="720" height="1080"></canvas>
      </div>
    </div>
    <div id="foot">Sample labels for testing the Route Planner scanner. Made-up names and tracking numbers, real Cumberland County street addresses, no carrier or retailer logos.</div>
  </div>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="warpFilter" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence id="warpNoise" type="fractalNoise" baseFrequency="0.006 0.009" numOctaves="2" seed="3" result="n"/>
    <feDisplacementMap id="warpMap" in="SourceGraphic" in2="n" scale="8" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <!-- Paper feed running at an uneven speed: displacement that varies only with the row, so print is squeezed in some bands and stretched in others. -->
  <filter id="feedFilter" x="0" y="-5%" width="100%" height="110%" color-interpolation-filters="sRGB">
    <feTurbulence id="feedNoise" type="fractalNoise" baseFrequency="0 0.004" numOctaves="2" seed="5" result="t"/>
    <!-- R and G forced to 0.5 (no sideways shift); only B, which varies with the row, moves the picture up and down. -->
    <feColorMatrix in="t" type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 1 0 0  0 0 0 0 1" result="n"/>
    <feDisplacementMap id="feedMap" in="SourceGraphic" in2="n" scale="0" xChannelSelector="R" yChannelSelector="B"/>
  </filter>
</svg>
<script src="node_modules/bwip-js/dist/bwip-js-min.js"></script>
<script src="app.js"></script>
</body>
</html>
